name: Remove Sentry from main

# dev دست نمی‌خورد و Sentry در آن می‌ماند.
# هر بار که PR از dev روی main merge شد، همین‌جا Sentry پاک و روی main کامیت می‌شود.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  remove-sentry:
    # جلوگیری از حلقه: کامیت خود اکشن دوباره اجرا نشود
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create release/main from dev
        run: git checkout -B release/main

      - name: Remove Sentry files
        run: |
          rm -f sentry.client.config.* sentry.server.config.* sentry.edge.config.*
          rm -f instrumentation-client.* .sentryclirc sentry.properties
          rm -f src/sentry.* src/instrumentation-client.*
          rm -rf .sentry
          # حذف سایر فایل‌هایی که اسمشان sentry دارد (به جز node_modules و .git و .github)
          find . -type f -iname '*sentry*' \
            -not -path './node_modules/*' -not -path './.git/*' \
            -not -path './.github/*' -delete

      - name: Remove Sentry packages
        run: |
          PKGS=$(node -e "
            const p=require('./package.json');
            const all={...p.dependencies,...p.devDependencies};
            console.log(Object.keys(all).filter(n=>n.startsWith('@sentry/')||n==='sentry'||n.startsWith('sentry-')).join(' '));
          ")
          if [ -n "$PKGS" ]; then
            if [ -f pnpm-lock.yaml ]; then
              npm i -g pnpm && pnpm remove $PKGS
            elif [ -f yarn.lock ]; then
              yarn remove $PKGS
            else
              npm uninstall $PKGS
            fi
          else
            echo "No Sentry packages found."
          fi

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: remove Sentry [skip ci]"
            git push origin main
          else
            echo "Nothing to remove."
          fi
