version: "3.8"

services:
  nextjs:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY}

    expose:
      - "3000"

    networks:
      - dokploy-network

    restart: always

    environment:
      NODE_ENV: production

    volumes:
      - /opt/metarang/sitemaps:/app/public/sitemaps

networks:
  dokploy-network:
    external: true
