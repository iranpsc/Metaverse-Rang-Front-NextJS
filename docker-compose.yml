version: "3.8"

services:
  nextjs:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY}

    expose:
      # Keep port 3000 available to Dokploy's reverse proxy without reserving a host port.
      - "3000"

    networks:
      - dokploy-network

    restart: always

    environment:
      NODE_ENV: production
      # Next.js standalone uses HOSTNAME as its bind address. Explicitly bind
      # to all interfaces so Dokploy's reverse proxy can reach the service.
      HOSTNAME: 0.0.0.0

    volumes:
      - type: bind
        source: ${SITEMAPS_HOST_PATH:-/opt/metarang/sitemaps}
        target: /app/public/sitemaps

networks:
  dokploy-network:
    external: true
