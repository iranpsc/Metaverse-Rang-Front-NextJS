version: "3.8"

services:
  nextjs:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-mirror-docker.runflare.com/node:22-alpine}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://package-mirror.liara.ir/repository/npm/}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY}

    expose:
      - "3000"

    networks:
      - dokploy-network

    restart: always

    environment:
      NODE_ENV: production

    volumes:
      - type: bind
        source: ${SITEMAPS_HOST_PATH:-/opt/metarang/sitemaps}
        target: /app/public/sitemaps

networks:
  dokploy-network:
    external: true
